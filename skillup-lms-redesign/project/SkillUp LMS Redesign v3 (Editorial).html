<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=1280" />
<title>SkillUp LMS — v3 Editorial</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root {
  --canvas: #FAF7F2;
  --paper: #FFFFFF;
  --paper-2: #F3EFE8;
  --ink: #1A1A1A;
  --ink-2: #4A4A4A;
  --ink-3: #7A7A7A;
  --ink-4: #B5B0A5;
  --line: #E6E0D4;
  --line-2: #D4CDBE;
  --accent: #FF5B2E;      /* warm tangerine */
  --accent-2: #FFB64A;
  --plum: #3B2A5C;
  --sage: #2F7A5B;
  --cream: #F9E7C7;
  --font: "Montserrat", ui-sans-serif, system-ui, sans-serif;
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  font-family: var(--font);
  background: var(--canvas);
  color: var(--ink);
  font-size: 14px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}
a { color: inherit; text-decoration: none; }
button { font-family: inherit; cursor: pointer; border: none; background: transparent; }

/* ---- LAYOUT ---- */
.app { display: grid; grid-template-columns: 240px 1fr; min-height: 100vh; }

.sidebar {
  background: var(--ink);
  color: #F3EEE6;
  padding: 24px 16px;
  position: sticky; top: 0;
  height: 100vh;
  display: flex; flex-direction: column;
  gap: 24px;
}
.sb-brand { display: flex; align-items: center; gap: 10px; padding: 4px 8px; }
.sb-brand .mk {
  width: 32px; height: 32px; border-radius: 10px;
  background: linear-gradient(135deg, var(--accent), var(--accent-2));
  display: inline-flex; align-items: center; justify-content: center;
  font-weight: 900; color: var(--ink); font-size: 15px;
}
.sb-brand .name { font-weight: 700; font-size: 16px; letter-spacing: -0.01em; }
.sb-brand .name small { display: block; font-size: 9.5px; font-weight: 500; color: rgba(255,255,255,0.55); letter-spacing: 0.12em; text-transform: uppercase; }

.sb-section {
  font-size: 10px; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase;
  color: rgba(255,255,255,0.4);
  padding: 8px 12px 6px;
}
.sb-nav { display: flex; flex-direction: column; gap: 2px; }
.sb-item {
  display: flex; align-items: center; gap: 12px;
  padding: 10px 12px;
  border-radius: 10px;
  color: rgba(255,255,255,0.7);
  font-size: 13.5px; font-weight: 500;
  width: 100%; text-align: left;
  transition: background 120ms, color 120ms;
}
.sb-item:hover { background: rgba(255,255,255,0.05); color: white; }
.sb-item.active { background: rgba(255,255,255,0.08); color: white; font-weight: 600; }
.sb-item svg { width: 18px; height: 18px; opacity: 0.85; }
.sb-item .k {
  margin-left: auto; font-size: 11px;
  padding: 1px 7px; border-radius: 999px;
  background: rgba(255,255,255,0.1); color: rgba(255,255,255,0.8);
  font-weight: 600;
}
.sb-item.active .k { background: var(--accent); color: var(--ink); }

.sb-foot { margin-top: auto; display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 12px; background: rgba(255,255,255,0.04); }
.sb-foot .ava {
  width: 36px; height: 36px; border-radius: 50%;
  background: linear-gradient(135deg, var(--accent), var(--cream));
  color: var(--ink); font-weight: 700; font-size: 13px;
  display: inline-flex; align-items: center; justify-content: center;
}
.sb-foot .nm { font-size: 12.5px; font-weight: 600; color: white; line-height: 1.2; }
.sb-foot .rl { font-size: 10.5px; color: rgba(255,255,255,0.55); letter-spacing: 0.06em; text-transform: uppercase; }

.main { min-width: 0; }
.wrap { max-width: 1100px; margin: 0 auto; padding: 28px 40px 80px; }

/* ---- TOP BAR (in main) ---- */
.topbar { display: flex; align-items: center; justify-content: space-between; padding: 14px 40px; border-bottom: 1px solid var(--line); background: var(--canvas); position: sticky; top: 0; z-index: 10; }
.search-field {
  flex: 1; max-width: 420px;
  display: flex; align-items: center; gap: 10px;
  padding: 9px 14px;
  background: var(--paper);
  border: 1px solid var(--line);
  border-radius: 999px;
  color: var(--ink-3);
  font-size: 13px;
}
.search-field input { flex: 1; border: none; outline: none; background: transparent; font: inherit; color: var(--ink); }
.search-field kbd { font-size: 10.5px; color: var(--ink-3); padding: 2px 6px; background: var(--paper-2); border: 1px solid var(--line); border-radius: 5px; font-family: inherit; font-weight: 600; }
.topbar-right { display: flex; align-items: center; gap: 10px; }
.icon-round {
  width: 38px; height: 38px; border-radius: 50%;
  background: var(--paper); border: 1px solid var(--line);
  display: inline-flex; align-items: center; justify-content: center;
  color: var(--ink-2);
  position: relative;
}
.icon-round:hover { background: var(--paper-2); }
.icon-round .dot { position: absolute; top: 8px; right: 8px; width: 8px; height: 8px; border-radius: 50%; background: var(--accent); border: 2px solid var(--canvas); }

/* ---- HERO (My Learning) ---- */
.hero {
  padding: 32px 0 36px;
  border-bottom: 1px solid var(--line);
  display: grid;
  grid-template-columns: 1.3fr 1fr;
  gap: 48px;
  align-items: end;
}
.hero .eyebrow { font-size: 11px; font-weight: 600; letter-spacing: 0.16em; text-transform: uppercase; color: var(--accent); margin-bottom: 16px; }
.hero h1 { font-size: 80px; font-weight: 800; letter-spacing: -0.04em; line-height: 0.9; margin: 0; }
.hero h1 em { font-style: italic; font-weight: 500; color: var(--ink-3); }
.hero .lede { color: var(--ink-2); font-size: 15px; line-height: 1.55; margin-top: 18px; max-width: 36ch; }

.hero-stats { display: flex; flex-direction: column; gap: 10px; }
.hero-stat {
  display: flex; align-items: baseline; justify-content: space-between;
  padding: 14px 0;
  border-top: 1px solid var(--line);
}
.hero-stat:last-child { border-bottom: 1px solid var(--line); }
.hero-stat .lbl { font-size: 11px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; color: var(--ink-3); }
.hero-stat .val { font-size: 22px; font-weight: 700; letter-spacing: -0.02em; }
.hero-stat .val small { font-size: 14px; font-weight: 500; color: var(--ink-3); margin-left: 4px; }

/* ---- LIVE NOW RIBBON ---- */
.live-ribbon {
  background: var(--ink);
  color: white;
  border-radius: 20px;
  padding: 18px 22px;
  display: grid;
  grid-template-columns: auto 1fr auto;
  align-items: center;
  gap: 20px;
  margin: 24px 0;
  position: relative;
  overflow: hidden;
}
.live-ribbon::before {
  content: ""; position: absolute; right: -40px; top: -80px;
  width: 280px; height: 280px; border-radius: 50%;
  background: radial-gradient(circle, rgba(255,91,46,0.5), transparent 70%);
}
.live-ribbon .led {
  position: relative; z-index: 1;
  width: 56px; height: 56px; border-radius: 50%;
  background: var(--accent);
  display: inline-flex; align-items: center; justify-content: center;
  box-shadow: 0 0 0 6px rgba(255,91,46,0.2), 0 0 24px rgba(255,91,46,0.4);
}
.live-ribbon .led::after {
  content: "";
  width: 18px; height: 18px; border-radius: 50%; background: white;
  animation: pulse 1.5s ease-in-out infinite;
}
@keyframes pulse { 0%,100% { transform: scale(1); opacity: 1; } 50% { transform: scale(1.2); opacity: 0.6; } }
.live-ribbon .lr-main { position: relative; z-index: 1; }
.live-ribbon .lr-tag { font-size: 11px; font-weight: 700; letter-spacing: 0.16em; text-transform: uppercase; color: var(--accent); }
.live-ribbon .lr-title { font-size: 18px; font-weight: 700; letter-spacing: -0.015em; margin-top: 4px; }
.live-ribbon .lr-sub { font-size: 12.5px; color: rgba(255,255,255,0.6); margin-top: 2px; }
.live-ribbon .lr-cta {
  position: relative; z-index: 1;
  display: flex; align-items: center; gap: 8px;
  background: var(--accent); color: var(--ink);
  padding: 12px 20px;
  border-radius: 999px;
  font-weight: 700; font-size: 13.5px;
}
.live-ribbon .lr-cta:hover { background: #FF7048; }

/* ---- SECTION HEADS ---- */
.section-split {
  display: grid;
  grid-template-columns: 240px 1fr;
  gap: 40px;
  padding: 40px 0;
  border-top: 1px solid var(--line);
}
.section-split .sh-left { position: sticky; top: 80px; align-self: start; }
.section-split h2 {
  font-size: 32px; font-weight: 700; letter-spacing: -0.025em;
  margin: 0;
  line-height: 1.05;
}
.section-split h2 em { font-style: italic; font-weight: 400; color: var(--ink-3); }
.section-split .sh-sub { color: var(--ink-3); font-size: 13px; margin-top: 10px; line-height: 1.5; }
.section-split .sh-count { font-size: 48px; font-weight: 800; color: var(--accent); line-height: 1; margin-top: 18px; letter-spacing: -0.04em; }
.section-split .sh-count small { font-size: 12px; color: var(--ink-3); font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; display: block; margin-top: 4px; }

/* ---- TABS (pill) ---- */
.pill-tabs { display: inline-flex; background: var(--paper-2); border-radius: 999px; padding: 4px; gap: 2px; margin-bottom: 22px; }
.pill-tab { padding: 8px 16px; border-radius: 999px; font-size: 13px; font-weight: 500; color: var(--ink-2); display: inline-flex; align-items: center; gap: 6px; }
.pill-tab:hover { color: var(--ink); }
.pill-tab.active { background: var(--ink); color: white; font-weight: 600; }
.pill-tab .n { font-size: 11px; opacity: 0.65; font-weight: 600; }

/* ---- PROGRAM / COURSE CARDS ---- */
.program-feature {
  display: grid;
  grid-template-columns: 1.1fr 1fr;
  background: var(--paper);
  border: 1px solid var(--line);
  border-radius: 24px;
  overflow: hidden;
  margin-bottom: 14px;
  transition: border-color 160ms, transform 160ms;
  cursor: pointer;
}
.program-feature:hover { border-color: var(--line-2); transform: translateY(-2px); }
.program-feature .pf-art {
  position: relative;
  min-height: 280px;
  background: linear-gradient(135deg, var(--plum) 0%, #6B4B8F 100%);
  color: white;
  padding: 24px;
  display: flex; flex-direction: column; justify-content: space-between;
  overflow: hidden;
}
.program-feature .pf-art.variant-a { background: linear-gradient(145deg, #1E3A5F 0%, #2F7A5B 100%); }
.program-feature .pf-art::before {
  content: "";
  position: absolute; inset: 0;
  background-image:
    radial-gradient(circle at 20% 30%, rgba(255,255,255,0.08), transparent 50%),
    radial-gradient(circle at 80% 80%, rgba(255,180,74,0.15), transparent 50%);
  pointer-events: none;
}
.program-feature .pf-art::after {
  content: "";
  position: absolute; right: -60px; bottom: -60px;
  width: 220px; height: 220px;
  border-radius: 50%;
  border: 60px solid rgba(255,255,255,0.08);
  pointer-events: none;
}
.pf-chips { display: flex; gap: 8px; flex-wrap: wrap; position: relative; z-index: 1; }
.pf-chip {
  background: rgba(255,255,255,0.15);
  color: white;
  backdrop-filter: blur(8px);
  padding: 5px 11px;
  border-radius: 999px;
  font-size: 11px; font-weight: 600;
  letter-spacing: 0.03em;
}
.pf-chip.accent { background: var(--accent); color: var(--ink); }
.pf-title { position: relative; z-index: 1; }
.pf-title .eye { font-size: 10.5px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; color: rgba(255,255,255,0.7); }
.pf-title h3 { font-size: 28px; font-weight: 700; letter-spacing: -0.02em; margin: 6px 0 0; line-height: 1.1; }
.pf-art .pf-meta { position: relative; z-index: 1; display: flex; gap: 20px; font-size: 11.5px; color: rgba(255,255,255,0.7); font-weight: 500; }
.pf-art .pf-meta strong { color: white; font-weight: 700; }

.program-feature .pf-body {
  padding: 24px 28px;
  display: flex; flex-direction: column; gap: 18px;
}
.pf-progress-block { display: flex; flex-direction: column; gap: 8px; }
.pf-progress-block .nums { display: flex; justify-content: space-between; align-items: baseline; }
.pf-progress-block .nums .pct { font-size: 36px; font-weight: 800; letter-spacing: -0.03em; }
.pf-progress-block .nums .lb { font-size: 11px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; color: var(--ink-3); }
.pf-progress-block .track { height: 6px; background: var(--paper-2); border-radius: 999px; overflow: hidden; }
.pf-progress-block .fill { height: 100%; background: var(--accent); border-radius: 999px; }

.pf-mini-stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; padding: 14px 0; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }
.pf-mini-stats .ms { display: flex; flex-direction: column; gap: 2px; padding: 0 10px; border-left: 1px solid var(--line); }
.pf-mini-stats .ms:first-child { border-left: none; padding-left: 0; }
.pf-mini-stats .ms .v { font-size: 14px; font-weight: 700; }
.pf-mini-stats .ms .l { font-size: 10px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; color: var(--ink-3); }

.pf-foot { display: flex; align-items: center; justify-content: space-between; gap: 14px; }
.pf-next { font-size: 12.5px; color: var(--ink-2); }
.pf-next strong { display: block; font-size: 13.5px; font-weight: 600; color: var(--ink); margin-top: 2px; }
.pf-cta { padding: 11px 20px; background: var(--ink); color: white; border-radius: 999px; font-weight: 600; font-size: 13px; display: inline-flex; align-items: center; gap: 6px; }
.pf-cta:hover { background: #333; }

/* Program (non-started) card */
.program-compact {
  display: flex; gap: 20px; align-items: center;
  background: var(--paper);
  border: 1px solid var(--line);
  border-radius: 20px;
  padding: 20px;
  margin-bottom: 10px;
}
.program-compact .pc-art {
  width: 120px; height: 120px; border-radius: 16px; flex-shrink: 0;
  background: linear-gradient(135deg, #2C2C2C, #5B5B5B);
  position: relative; overflow: hidden;
}
.program-compact .pc-art::before { content: ""; position: absolute; inset: 0; background-image: radial-gradient(circle at 30% 30%, rgba(255,91,46,0.3), transparent 60%); }
.program-compact .pc-body { flex: 1; display: flex; flex-direction: column; gap: 6px; }
.program-compact .pc-body h3 { font-size: 20px; font-weight: 700; letter-spacing: -0.015em; margin: 0; }
.program-compact .pc-meta { color: var(--ink-3); font-size: 12.5px; }
.program-compact .pc-cta { padding: 9px 16px; border: 1px solid var(--line-2); border-radius: 999px; font-weight: 600; font-size: 12.5px; color: var(--ink); }

/* Course cards grid */
.course-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
.course-card {
  background: var(--paper);
  border: 1px solid var(--line);
  border-radius: 20px;
  overflow: hidden;
  transition: border-color 160ms, transform 160ms;
  cursor: pointer;
  display: flex; flex-direction: column;
}
.course-card:hover { border-color: var(--line-2); transform: translateY(-2px); }
.course-card .cc-art {
  aspect-ratio: 16/10;
  position: relative;
  overflow: hidden;
  padding: 18px;
  color: white;
  display: flex; align-items: end;
}
.course-card .cc-art h4 { font-size: 19px; font-weight: 700; letter-spacing: -0.015em; margin: 0; line-height: 1.2; position: relative; z-index: 1; }
.cc-art.a { background: linear-gradient(140deg, #FF5B2E 0%, #FFB64A 100%); color: var(--ink); }
.cc-art.b { background: linear-gradient(140deg, #3B2A5C 0%, #7A5FA8 100%); }
.cc-art.c { background: linear-gradient(140deg, #0E4D3E 0%, #2F7A5B 100%); }
.cc-art.d { background: linear-gradient(140deg, #1E3A5F 0%, #4A7BB5 100%); }
.cc-art.e { background: linear-gradient(140deg, #7A2E3B 0%, #C45A6A 100%); }
.cc-art.f { background: linear-gradient(140deg, #2C2C2C 0%, #5B5B5B 100%); }
.cc-art::before {
  content: "";
  position: absolute; inset: 0;
  background-image:
    repeating-linear-gradient(45deg, rgba(255,255,255,0.04) 0 2px, transparent 2px 14px);
}
.cc-art .cc-tag { position: absolute; top: 14px; left: 14px; font-size: 10px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; padding: 4px 9px; border-radius: 999px; background: rgba(255,255,255,0.2); backdrop-filter: blur(8px); }
.cc-art.a .cc-tag { background: rgba(0,0,0,0.15); color: var(--ink); }
.cc-art .cc-next {
  position: absolute; top: 14px; right: 14px;
  font-size: 10px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase;
  padding: 4px 9px; border-radius: 999px;
  background: var(--accent); color: var(--ink);
  display: inline-flex; align-items: center; gap: 5px;
}
.cc-art .cc-next::before { content: ""; width: 5px; height: 5px; border-radius: 50%; background: var(--ink); animation: pulse 1.4s ease-in-out infinite; }
.course-card .cc-body { padding: 16px 18px; display: flex; flex-direction: column; gap: 10px; }
.course-card .cc-meta { font-size: 11px; color: var(--ink-3); font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; }
.course-card .cc-progress { display: flex; align-items: center; gap: 10px; }
.course-card .cc-progress .track { flex: 1; height: 4px; background: var(--paper-2); border-radius: 999px; overflow: hidden; }
.course-card .cc-progress .fill { height: 100%; background: var(--ink); border-radius: 999px; }
.course-card .cc-progress .pct { font-size: 12px; font-weight: 700; min-width: 32px; text-align: right; }
.course-card .cc-foot { display: flex; justify-content: space-between; align-items: center; padding-top: 10px; border-top: 1px solid var(--line); }
.course-card .cc-foot .status { font-size: 12px; color: var(--ink-2); font-weight: 500; }
.course-card .cc-foot .arrow { width: 32px; height: 32px; border-radius: 50%; background: var(--paper-2); display: inline-flex; align-items: center; justify-content: center; color: var(--ink); }
.course-card:hover .cc-foot .arrow { background: var(--accent); }

.badge-not-started { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 999px; background: var(--paper-2); color: var(--ink-2); font-size: 11px; font-weight: 600; }
.badge-pre-work { background: var(--cream); color: #8A5A1C; }
.badge-starts { background: #FFE8DC; color: #B8431F; }

/* ========= PROGRAM DETAIL ========= */
.pd-cover {
  margin: 0 -40px;
  background: linear-gradient(145deg, #1E3A5F 0%, #2F7A5B 100%);
  color: white;
  padding: 40px 40px 60px;
  position: relative;
  overflow: hidden;
}
.pd-cover::before {
  content: ""; position: absolute; right: -100px; top: -150px;
  width: 500px; height: 500px; border-radius: 50%;
  background: radial-gradient(circle, rgba(255,180,74,0.25), transparent 70%);
}
.pd-cover::after {
  content: ""; position: absolute; left: -80px; bottom: -120px;
  width: 360px; height: 360px; border-radius: 50%;
  border: 80px solid rgba(255,255,255,0.05);
}
.pd-cover .wrap-inner { max-width: 1100px; margin: 0 auto; padding: 0 40px; position: relative; z-index: 1; }
.pd-back { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: rgba(255,255,255,0.7); padding: 6px 12px; border-radius: 999px; background: rgba(255,255,255,0.08); margin-bottom: 28px; }
.pd-back:hover { background: rgba(255,255,255,0.14); color: white; }
.pd-chips { display: flex; gap: 8px; margin-bottom: 20px; }
.pd-chip { padding: 5px 12px; border-radius: 999px; font-size: 11px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; background: rgba(255,255,255,0.15); backdrop-filter: blur(8px); }
.pd-chip.accent { background: var(--accent); color: var(--ink); }
.pd-title { font-size: 64px; font-weight: 800; letter-spacing: -0.035em; line-height: 0.95; margin: 0; max-width: 16ch; }
.pd-sub { color: rgba(255,255,255,0.7); margin-top: 16px; font-size: 14px; display: flex; gap: 14px; flex-wrap: wrap; }
.pd-sub span { display: inline-flex; align-items: center; gap: 6px; }

.pd-progress-strip {
  margin-top: 36px;
  display: grid;
  grid-template-columns: auto 1fr auto;
  gap: 24px;
  align-items: center;
}
.pd-progress-ring { position: relative; width: 120px; height: 120px; }
.pd-progress-ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.pd-progress-ring .lbl { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; }
.pd-progress-ring .lbl .v { font-size: 32px; font-weight: 800; letter-spacing: -0.03em; }
.pd-progress-ring .lbl .l { font-size: 9.5px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: rgba(255,255,255,0.7); }
.pd-progress-stats { display: grid; grid-template-columns: repeat(3,1fr); gap: 20px; }
.pd-progress-stats .it { display: flex; flex-direction: column; gap: 2px; }
.pd-progress-stats .lb { font-size: 10.5px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: rgba(255,255,255,0.6); }
.pd-progress-stats .vl { font-size: 22px; font-weight: 700; letter-spacing: -0.02em; }
.pd-progress-stats .sb { font-size: 11px; color: rgba(255,255,255,0.6); }

function App() {
  const [tweaks, setTweak] = useTweaks(TWEAK_DEFAULTS);
  const [screen, setScreen] = useState(tweaks.screen || "my-learning");

  useEffect(() => {setScreen(tweaks.screen || "my-learning");}, [tweaks.screen]);

  useEffect(() => {
    document.documentElement.style.setProperty("--accent", tweaks.accentHex || "#FF5B2E");
  }, [tweaks.accentHex]);

  return (
    <>
      <Sidebar screen={screen} onNav={(s) => {setScreen(s);setTweak("screen", s);}} />
      <main className="main" data-screen-label={screen === "program-detail" ? "Program Detail" : "My Learning"}>
        <Topbar />
        {screen === "my-learning" &&
        <MyLearning
          onOpenProgram={() => {setScreen("program-detail");setTweak("screen", "program-detail");}}
          onJoinLive={() => alert("Live session would open here (Immersive VILT not rebuilt in v3).")} />

        }
        {screen === "program-detail" &&
        <ProgramDetail
          onBack={() => {setScreen("my-learning");setTweak("screen", "my-learning");}}
          onOpenCourse={() => alert("Course Detail not rebuilt in v3.")} />

        }
      </main>

      <TweaksPanel title="Tweaks">
        <TweakSection title="Navigate">
          <TweakRadio label="Screen" value={tweaks.screen || "my-learning"}
          options={[
          { value: "my-learning", label: "My Learning" },
          { value: "program-detail", label: "Program Detail" }]
          }
          onChange={(v) => {setScreen(v);setTweak("screen", v);}} />
          
        </TweakSection>
        <TweakSection title="Brand">
          <TweakColor label="Accent color" value={tweaks.accentHex || "#FF5B2E"}
          onChange={(v) => setTweak("accentHex", v)} />
        </TweakSection>
      </TweaksPanel>
    </>);

}

ReactDOM.createRoot(document.getElementById("app")).render(<App />);
