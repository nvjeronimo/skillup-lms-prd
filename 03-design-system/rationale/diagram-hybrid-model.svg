<svg viewBox="0 0 960 540" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t2 d2" font-family="Montserrat, system-ui, sans-serif">
<title id="t2">Resolved hybrid token model</title>
<desc id="d2">Three collections: Primitives at the base, Core/Semantic with combined brand and scheme modes, Breakpoints with device modes. Text styles compose family from Core and sizes from Breakpoints. Core maps to data-brand and data-theme; Breakpoints maps to media queries.</desc>
<style>
 .bg{fill:#fff}
 .ac{fill:#EBF8FF;stroke:#26708E;stroke-width:1.5}
 .bx{fill:#f3f5fa;stroke:#d7dee4;stroke-width:1.5}
 .t{fill:#1f2937;font-size:14.5px;font-weight:600}
 .s{fill:#677482;font-size:11px;font-weight:500}
 .li{fill:#13282F;font-size:11px;font-family:ui-monospace,Menlo,monospace}
 .h{fill:#13282F;font-size:12.5px;font-weight:700;letter-spacing:.03em}
 .ml{fill:#677482;font-size:9px;font-weight:600;letter-spacing:.03em}
 .cp{fill:#fff;stroke:#26708E;stroke-width:1}
 .ct{fill:#26708E;font-size:9.5px;font-weight:600}
 .ln{stroke:#9aa7b2;stroke-width:1.5;fill:none}
 .lt{fill:#677482;font-size:10px}
</style>
<rect class="bg" x="0" y="0" width="960" height="540"/>
<rect class="bx" x="40" y="56" width="540" height="104" rx="12"/>
<text class="t" x="60" y="84">Text styles</text>
<text class="s" x="60" y="103">heading / body / caption — composite, accessible</text>
<text class="li" x="60" y="128">compose: font-family (Core) + size · line-height (Breakpoints)</text>
<rect class="bx" x="600" y="56" width="320" height="104" rx="12"/>
<text class="h" x="618" y="82">CSS delivery</text>
<text class="li" x="618" y="104">Core → :root · [data-theme] · [data-brand]</text>
<text class="li" x="618" y="124">Breakpoints → @media</text>
<text class="lt" x="618" y="146">font-size (brand×breakpoint) → chain / scale factor</text>
<rect class="ac" x="40" y="220" width="430" height="170" rx="12"/>
<text class="t" x="60" y="248">2. Core / Semantic</text>
<text class="s" x="60" y="267">role tokens · brand customization = re-alias per mode</text>
<text class="li" x="60" y="292">color: text / bg / fg / border</text>
<text class="li" x="60" y="312">dims: radius-card · border-width</text>
<text class="li" x="60" y="332">type: font-family</text>
<text class="ml" x="60" y="356">MODES</text>
<rect class="cp" x="112" y="346" width="58" height="16" rx="8"/><text class="ct" x="120" y="357">SKO-L</text>
<rect class="cp" x="174" y="346" width="60" height="16" rx="8"/><text class="ct" x="182" y="357">SKO-D</text>
<rect class="cp" x="238" y="346" width="78" height="16" rx="8"/><text class="ct" x="246" y="357">BrandX-L</text>
<rect class="cp" x="320" y="346" width="80" height="16" rx="8"/><text class="ct" x="328" y="357">BrandX-D</text>
<rect class="bx" x="500" y="220" width="420" height="170" rx="12"/>
<text class="t" x="520" y="248">4. Breakpoints</text>
<text class="s" x="520" y="267">responsive scale · brand-agnostic</text>
<text class="li" x="520" y="292">font-size · line-height</text>
<text class="li" x="520" y="312">spacing · container · widths</text>
<text class="ml" x="520" y="356">MODES</text>
<rect class="cp" x="572" y="346" width="68" height="16" rx="8"/><text class="ct" x="580" y="357">Desktop</text>
<rect class="cp" x="644" y="346" width="56" height="16" rx="8"/><text class="ct" x="652" y="357">Tablet</text>
<rect class="cp" x="704" y="346" width="60" height="16" rx="8"/><text class="ct" x="712" y="357">Mobile</text>
<rect class="bx" x="40" y="430" width="880" height="86" rx="12"/>
<text class="t" x="60" y="458">1. Primitives  (1 mode)</text>
<text class="s" x="60" y="477">all raw values; grows per brand</text>
<text class="li" x="60" y="500">colour ramps (SkillUp + BrandX) · size/space/radius/width pool · weights · breakpoint thresholds</text>
<path class="ln" d="M255 220 L255 165" marker-end="url(#a)"/>
<text class="lt" x="262" y="195">family</text>
<path class="ln" d="M650 220 C 650 190, 560 175, 540 165" marker-end="url(#a)"/>
<text class="lt" x="560" y="200">sizes</text>
<path class="ln" d="M255 390 L255 430" marker-end="url(#a)"/>
<text class="lt" x="262" y="416">alias</text>
<path class="ln" d="M700 390 L700 430" marker-end="url(#a)"/>
<text class="lt" x="707" y="416">alias</text>
<defs>
  <marker id="a" markerWidth="9" markerHeight="9" refX="5" refY="4.5" orient="auto"><path d="M1 1 L7 4.5 L1 8" fill="none" stroke="#9aa7b2" stroke-width="1.5"/></marker>
</defs>
</svg>
