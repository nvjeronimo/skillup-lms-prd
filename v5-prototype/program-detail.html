<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AI-Driven Digital Marketing · Program · SkillUp V5</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="assets/tokens.css" />
  <link rel="stylesheet" href="assets/styles.css" />
  <style>
    /* ===== Dark hero (Program PD) ===== */
    .pd-hero {
      background: var(--hero-dark-bg);
      color: var(--hero-dark-text);
      padding: 28px var(--page-pad-x) 0;
      border-bottom: 0;
    }
    .pd-hero__inner {
      max-width: var(--page-max);
      margin: 0 auto;
    }
    .pd-hero__breadcrumb {
      font-size: 12px;
      color: var(--hero-dark-text-muted);
      margin-bottom: 20px;
    }
    .pd-hero__breadcrumb a { color: var(--hero-dark-text-muted); }
    .pd-hero__breadcrumb a:hover { color: var(--hero-dark-text); }
    .pd-hero__breadcrumb .sep { margin: 0 8px; color: var(--hero-dark-sep); }

    .pd-hero__label {
      display: flex; align-items: center; gap: 10px; margin-bottom: 14px;
    }
    .pd-hero__label .program-badge {
      background: rgba(251, 191, 36, 0.18);
      color: var(--hero-dark-star);
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 1.2px;
      padding: 3px 10px;
      border-radius: var(--radius-pill);
    }
    .pd-hero__label .starts-pill {
      background: rgba(235, 153, 41, 0.2);
      color: var(--hero-dark-star);
      font-size: 11px;
      font-weight: 600;
      padding: 3px 10px;
      border-radius: var(--radius-pill);
      border: 1px solid rgba(251, 191, 36, 0.4);
    }

    .pd-hero__title {
      font-size: 32px;
      font-weight: 700;
      letter-spacing: -0.5px;
      margin: 0 0 12px;
      max-width: 820px;
      line-height: 1.15;
    }
    .pd-hero__desc {
      font-size: 14px;
      color: var(--hero-dark-text-soft);
      max-width: 820px;
      margin: 0 0 24px;
      line-height: 1.55;
    }

    /* Side-by-side: Your progress card + Continue card (embedded in dark hero) */
    .pd-hero__splitrow {
      display: grid;
      grid-template-columns: 1fr 280px;
      gap: 16px;
      margin-bottom: 24px;
    }
    @media (max-width: 860px) {
      .pd-hero__splitrow { grid-template-columns: 1fr; }
    }

    .pd-progress-card {
      background: white;
      border-radius: var(--radius-xl);
      padding: 20px 22px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.25);
    }
    .pd-progress-card__head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
    }
    .pd-progress-card__title {
      font-size: 14px;
      font-weight: 700;
      color: var(--ink-800);
      margin: 0;
    }
    .pd-progress-card__pct {
      font-size: 28px;
      font-weight: 700;
      color: var(--progress-fill);
      line-height: 1;
    }
    .pd-progress-card .progress {
      height: 6px;
      margin-bottom: 18px;
    }
    .pd-progress-card__kpis {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 12px;
    }
    @media (max-width: 900px) {
      .pd-progress-card__kpis { grid-template-columns: repeat(3, 1fr); }
    }
    @media (max-width: 560px) {
      .pd-progress-card__kpis { grid-template-columns: repeat(2, 1fr); }
    }
    .pd-kpi {
      text-align: left;
      padding-left: 10px;
      border-left: 2px solid var(--surface-divider);
    }
    .pd-kpi--accent { border-left-color: var(--warn-amber); }
    .pd-kpi__label {
      font-size: 10px;
      font-weight: 700;
      color: var(--ink-400);
      letter-spacing: 0.8px;
      margin-bottom: 4px;
    }
    .pd-kpi__value {
      font-size: 16px;
      font-weight: 700;
      color: var(--ink-800);
      line-height: 1.1;
    }
    .pd-kpi--accent .pd-kpi__value { color: var(--warn-amber-dark); }
    .pd-kpi__sub {
      font-size: 11px;
      color: var(--ink-400);
      margin-top: 1px;
    }

    .pd-continue {
      background: white;
      border-radius: var(--radius-xl);
      padding: 18px 20px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.25);
      display: flex; flex-direction: column;
      justify-content: space-between;
    }
    .pd-continue__kicker {
      font-size: 10px; font-weight: 700;
      color: var(--progress-fill);
      letter-spacing: 1.2px;
      margin-bottom: 6px;
    }
    .pd-continue__title {
      font-size: 15px; font-weight: 700;
      color: var(--ink-800);
      margin: 0 0 4px;
      line-height: 1.3;
    }
    .pd-continue__meta {
      font-size: 12px; color: var(--ink-400);
      margin-bottom: 16px;
    }
    .pd-continue .btn { width: 100%; justify-content: center; }

    /* Milestone strip (white, embedded in hero bottom) */
    .pd-milestones {
      background: white;
      border-radius: var(--radius-xl);
      padding: 14px 22px;
      display: grid;
      grid-template-columns: 1fr 1fr 1fr auto;
      gap: 20px;
      align-items: center;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.25);
      margin-bottom: 32px;
    }
    @media (max-width: 860px) {
      .pd-milestones { grid-template-columns: 1fr; gap: 12px; padding: 14px 18px; }
    }
    .pd-milestone {
      padding-left: 14px;
      border-left: 3px solid var(--ink-400);
    }
    .pd-milestone__label {
      font-size: 10px; font-weight: 700;
      color: var(--ink-400);
      letter-spacing: 1px;
      margin-bottom: 2px;
    }
    .pd-milestone__val {
      font-size: 13px; font-weight: 600; color: var(--ink-800);
    }
    .pd-milestones__link {
      font-size: 13px; font-weight: 600;
      color: var(--brand-blue);
      padding: 10px 14px;
      border-radius: var(--radius-md);
      white-space: nowrap;
    }
    .pd-milestones__link:hover { background: var(--surface-grey-100); }

    /* Main body below hero */
    .pd-body {
      max-width: var(--page-max);
      margin: 0 auto;
      padding: 28px var(--page-pad-x) 48px;
    }

    /* Amber prep banner */
    .prep-banner {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      background: var(--warn-amber-soft);
      border: 1px solid var(--warn-amber-border);
      border-left-width: 3px;
      border-radius: var(--radius-md);
      padding: 14px 16px;
      margin-bottom: 24px;
      font-size: 13px;
      color: var(--warn-amber-darker);
      line-height: 1.5;
    }
    .prep-banner__icon { color: var(--warn-amber-dark); font-size: 16px; flex-shrink: 0; }
    .prep-banner strong { color: var(--warn-amber-dark); }

    /* Course list (8 tiles) */
    .pd-courses { display: flex; flex-direction: column; gap: 10px; margin-bottom: 32px; }
    .course-tile {
      display: grid;
      grid-template-columns: 40px 1fr auto;
      align-items: center;
      gap: 20px;
      padding: 18px 20px;
      background: white;
      border: 1px solid var(--surface-border);
      border-radius: var(--radius-xl);
      transition: box-shadow .15s, border-color .15s;
      cursor: pointer;
    }
    .course-tile:hover { box-shadow: var(--shadow-md); border-color: var(--surface-border-hover); }
    .course-tile--locked {
      background: var(--surface-locked-card);
      border-style: dashed;
      border-color: var(--surface-border-soft);
    }
    .course-tile--locked:hover { box-shadow: var(--shadow-xs); }
    .course-tile--active { border-color: var(--progress-fill); box-shadow: 0 0 0 1px var(--progress-fill) inset; }
    .course-tile__num {
      width: 36px; height: 36px; border-radius: 50%;
      background: var(--surface-grey-200);
      display: flex; align-items: center; justify-content: center;
      font-size: 13px; font-weight: 700; color: var(--ink-500);
    }
    .course-tile--completed .course-tile__num { background: var(--success-fill); color: white; }
    .course-tile--active .course-tile__num { background: var(--progress-fill); color: white; }
    .course-tile--available .course-tile__num { background: var(--ink-700); color: white; }
    .course-tile--locked .course-tile__num { background: var(--surface-divider); color: var(--hero-dark-text-muted); }

    .course-tile__title {
      font-size: 15px; font-weight: 600;
      color: var(--ink-800);
      margin: 0 0 4px;
    }
    .course-tile--locked .course-tile__title { color: var(--ink-400); font-weight: 500; }
    .course-tile__meta { font-size: 12px; color: var(--ink-400); }
    .course-tile__meta-row {
      display: flex; align-items: center; gap: 10px; margin-top: 6px; flex-wrap: wrap;
    }
    .course-tile__right { display: flex; align-items: center; gap: 14px; }
    .course-tile__progress {
      width: 100px; height: 4px;
      background: var(--progress-track);
      border-radius: 2px; overflow: hidden;
    }
    .course-tile__progress > div { height: 100%; background: var(--progress-fill); }
    .course-tile--completed .course-tile__progress > div { background: var(--success-fill); }
    .course-tile__pct {
      font-size: 13px; font-weight: 700; color: var(--ink-700);
      min-width: 36px; text-align: right;
    }

    /* 3-card info grid */
    .pd-info-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
    }
    @media (max-width: 860px) {
      .pd-info-grid { grid-template-columns: 1fr; }
    }
    .info-card {
      background: white;
      border: 1px solid var(--surface-border);
      border-radius: var(--radius-xl);
      padding: 20px;
      position: relative;
      overflow: hidden;
    }
    .info-card::before {
      content: ""; position: absolute; left: 0; top: 0; bottom: 0;
      width: 3px;
      background: var(--bar-color, var(--ink-400));
    }
    .info-card__title {
      font-size: 15px; font-weight: 700;
      color: var(--ink-800);
      margin: 0 0 2px;
    }
    .info-card__subtitle {
      font-size: 12px; color: var(--ink-400);
      margin-bottom: 14px;
    }
    .info-card__rows { margin: 0; padding: 0; list-style: none; }
    .info-card__row {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 0;
      border-top: 1px solid var(--surface-divider);
      font-size: 13px; color: var(--ink-600);
    }
    .info-card__row:first-child { border-top: 0; padding-top: 0; }
    .info-card__marker {
      width: 50px; font-weight: 700; color: var(--ink-700); font-size: 13px;
      flex-shrink: 0;
    }

    /* Tabs row */
    .pd-tabs {
      display: flex;
      gap: 0;
      border-bottom: 1px solid var(--surface-border);
      margin-bottom: 24px;
      overflow-x: auto;
    }
    .pd-tabs::-webkit-scrollbar { display: none; }
    .pd-tab {
      padding: 14px 22px;
      font-size: 14px;
      font-weight: 500;
      color: var(--ink-400);
      border-bottom: 2px solid transparent;
      background: none;
      cursor: pointer;
      white-space: nowrap;
    }
    .pd-tab:hover { color: var(--ink-700); }
    .pd-tab.active {
      color: var(--ink-800);
      font-weight: 600;
      border-bottom-color: var(--ink-800);
    }
  </style>
</head>
<body>
<div class="page page--dark-hero" data-shell data-shell-active="my-learning">

  <!-- ===== Dark hero ===== -->
  <section class="pd-hero">
    <div class="pd-hero__inner">
      <nav class="pd-hero__breadcrumb">
        <a href="index.html">My Learning</a><span class="sep">›</span><span>AI-Driven Digital Marketing Certificate</span>
      </nav>

      <div class="pd-hero__label">
        <span class="program-badge">★ PROGRAM</span>
        <span class="starts-pill" id="pd-starts"></span>
      </div>
      <h1 class="pd-hero__title" id="pd-title"></h1>
      <p class="pd-hero__desc" id="pd-subtitle"></p>

      <!-- Side-by-side: Progress card + Continue card -->
      <div class="pd-hero__splitrow">
        <div class="pd-progress-card">
          <div class="pd-progress-card__head">
            <h3 class="pd-progress-card__title">Your progress</h3>
            <div class="pd-progress-card__pct" id="pd-pct"></div>
          </div>
          <div class="progress"><div class="progress__fill" id="pd-pct-bar" style="width:0%"></div></div>
          <div class="pd-progress-card__kpis" id="pd-kpis"></div>
        </div>

        <div class="pd-continue" onclick="window.location='course-detail.html'" style="cursor:pointer">
          <div>
            <div class="pd-continue__kicker">CONTINUE WHERE YOU LEFT OFF</div>
            <h3 class="pd-continue__title" id="pd-continue-title"></h3>
            <div class="pd-continue__meta" id="pd-continue-meta"></div>
          </div>
          <button class="btn btn--action">Resume →</button>
        </div>
      </div>

      <!-- Milestone strip -->
      <div class="pd-milestones" id="pd-milestones"></div>
    </div>
  </section>

  <!-- ===== Body ===== -->
  <div class="pd-body">

    <!-- Tabs -->
    <div class="pd-tabs" id="pd-tabs"></div>

    <!-- Amber prep banner -->
    <div class="prep-banner">
      <span class="prep-banner__icon">⏱</span>
      <div id="pd-prep-banner"></div>
    </div>

    <!-- Courses list -->
    <div class="pd-courses" id="pd-courses"></div>

    <!-- 3-card info grid -->
    <div class="pd-info-grid" id="pd-info-grid"></div>
  </div>
</div>

<script src="assets/data.js"></script>
<script src="assets/app.js"></script>
<script>
  (function () {
    const p = window.V5_DATA.program;
    const esc = window.V5.escapeHtml;

    document.getElementById("pd-starts").textContent = p.startsBadge;
    document.getElementById("pd-title").textContent = p.title;
    document.getElementById("pd-subtitle").textContent = p.subtitle;

    // Progress card
    document.getElementById("pd-pct").textContent = p.progress.pct + "%";
    document.getElementById("pd-pct-bar").style.width = p.progress.pct + "%";
    document.getElementById("pd-kpis").innerHTML = p.progress.kpis.map(k => `
      <div class="pd-kpi ${k.accent ? 'pd-kpi--accent' : ''}">
        <div class="pd-kpi__label">${esc(k.label)}</div>
        <div class="pd-kpi__value">${esc(k.value)}</div>
        <div class="pd-kpi__sub">${esc(k.sub)}</div>
      </div>
    `).join("");

    // Continue card
    document.getElementById("pd-continue-title").textContent = p.continueCard.title;
    document.getElementById("pd-continue-meta").textContent = p.continueCard.meta;

    // Milestone strip
    document.getElementById("pd-milestones").innerHTML = `
      ${p.milestoneStrip.map(m => `
        <div class="pd-milestone" style="border-left-color:${m.bar}">
          <div class="pd-milestone__label">${esc(m.label)}</div>
          <div class="pd-milestone__val">${esc(m.value)}</div>
        </div>
      `).join("")}
      <a href="coming-soon.html?section=Program+Details" class="pd-milestones__link">View program details →</a>
    `;

    // Tabs — every tab has a destination
    const programTabRoutes = {
      "Courses": null, // stays on this page
      "Live Sessions": "live-sessions-upcoming.html",
      "Calendar": "my-calendar.html",
      "Mentoring": "coming-soon.html?section=Mentoring",
      "Certificates": "coming-soon.html?section=Certificates",
      "About": "coming-soon.html?section=About",
    };
    document.getElementById("pd-tabs").innerHTML = p.tabs.map((t, i) => `
      <button class="pd-tab ${i === 0 ? 'active' : ''}" data-tab-label="${esc(t)}">${esc(t)}</button>
    `).join("");
    document.querySelectorAll("#pd-tabs .pd-tab").forEach(b => {
      b.addEventListener("click", () => {
        const label = b.dataset.tabLabel;
        const href = programTabRoutes[label];
        if (href) { window.location = href; return; }
        document.querySelectorAll("#pd-tabs .pd-tab").forEach(x => x.classList.remove("active"));
        b.classList.add("active");
      });
    });

    // Prep banner
    document.getElementById("pd-prep-banner").innerHTML = `<strong>Heads up.</strong> ${esc(p.prepBanner)}`;

    // Courses
    document.getElementById("pd-courses").innerHTML = p.courses.map(c => {
      const numDisplay = c.state === "completed" ? "✓" : c.state === "locked" ? "🔒" : c.num;
      const prepChip = c.prep ? `<span class="prep-chip" style="background:var(--prep-chip-bg); color:var(--prep-chip-text); font-size:10px; font-weight:700; padding:2px 8px; border-radius:var(--radius-pill); letter-spacing:0.3px;">PREPARATION TRACK</span>` : "";
      const stateBadge = (() => {
        if (c.state === "completed") return `<span class="badge badge--completed">Completed</span>`;
        if (c.state === "active") return `<span class="badge badge--inprogress">In Progress · ${c.progress}%</span>`;
        if (c.state === "available") return `<span class="badge badge--notstarted">Available</span>`;
        return `<span class="badge badge--locked">Unlocks ${esc(c.unlock)}</span>`;
      })();

      let right = "";
      if (c.state === "completed") {
        right = `<button class="btn btn--secondary btn--sm" onclick="event.stopPropagation();">${esc(c.cta)} →</button>`;
      } else if (c.state === "active") {
        right = `
          <div class="course-tile__progress"><div style="width:${c.progress}%"></div></div>
          <div class="course-tile__pct">${c.progress}%</div>
          <button class="btn btn--action btn--sm" onclick="event.stopPropagation();">${esc(c.cta)} →</button>
        `;
      } else if (c.state === "available") {
        right = `<button class="btn btn--action btn--sm" onclick="event.stopPropagation();">${esc(c.cta)} →</button>`;
      } else {
        right = `<button class="btn btn--ghost btn--sm" onclick="event.stopPropagation();">Preview →</button>`;
      }

      return `
        <div class="course-tile course-tile--${c.state}" onclick="window.location='course-detail.html'">
          <div class="course-tile__num">${numDisplay}</div>
          <div>
            <div class="course-tile__title">Course ${c.num}: ${esc(c.title)}</div>
            <div class="course-tile__meta">${esc(c.meta)}</div>
            <div class="course-tile__meta-row">${stateBadge}${prepChip}</div>
          </div>
          <div class="course-tile__right">${right}</div>
        </div>
      `;
    }).join("");

    // Info cards (3-card grid)
    document.getElementById("pd-info-grid").innerHTML = p.infoCards.map(card => `
      <div class="info-card" style="--bar-color:${card.bar}">
        <h3 class="info-card__title">${esc(card.title)}</h3>
        <div class="info-card__subtitle">${esc(card.subtitle)}</div>
        <ul class="info-card__rows">
          ${card.rows.map(r => `
            <li class="info-card__row">
              <span class="info-card__marker">${esc(r.date || r.num || "")}</span>
              <span>${esc(r.label)}</span>
            </li>
          `).join("")}
        </ul>
      </div>
    `).join("");
  })();
</script>
</body>
</html>
